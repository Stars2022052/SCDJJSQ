<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>潮汐秘境定制器</title>
<style>
:root{
  --font:"Inter",system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;
  --bg:#eef1f7; --panel:#fff; --ink:#171a22; --muted:#6a7285; --line:#e4e8f0;
  --accent:#3b6ef6; --ok:#17754a; --warn:#b7791f;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  font-family:var(--font);color:var(--ink);
  background:radial-gradient(1100px 500px at 50% -10%,#fff,transparent 60%),linear-gradient(160deg,var(--bg),#e5eaf4);
  background-attachment:fixed;font-size:14px;line-height:1.5;
  padding:22px 20px 40px;
}
.wrap{max-width:1420px;margin:0 auto}

/* ---------- 顶栏 ---------- */
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;flex-wrap:wrap;margin-bottom:14px}
.brand h1{margin:0;font-size:20px;font-weight:760;letter-spacing:-.015em}
.brand p{margin:3px 0 0;color:var(--muted);font-size:12.5px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{
  font:inherit;font-size:12.5px;font-weight:650;color:var(--ink);background:#fff;
  border:1px solid var(--line);border-radius:10px;padding:8px 13px;cursor:pointer;
  box-shadow:0 1px 2px rgba(20,30,60,.04);transition:all .14s;display:inline-flex;align-items:center;gap:6px;
}
.btn:hover{background:#f7f9fd;border-color:#cfd7e6}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 4px 14px -4px rgba(59,110,246,.6)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.mini{padding:4px 8px;font-size:11.5px;border-radius:8px}

/* ---------- 状态条 ---------- */
.status{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  background:#fff;border:1px solid var(--line);border-radius:12px;
  padding:10px 14px;margin-bottom:14px;font-size:12.5px;color:var(--muted);
}
.status b{color:var(--ink)}
.dot{width:8px;height:8px;border-radius:50%;background:#c9d2e0;flex:none}
.dot.ok{background:#2fa36b}
.dot.warn{background:#e0a12e}
.status .grow{flex:1}

/* ---------- 主布局 ---------- */
.main{display:grid;grid-template-columns:404px minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:1080px){ .main{grid-template-columns:1fr} }

/* ---------- 编辑器 ---------- */
.editor{
  background:#fff;border:1px solid var(--line);border-radius:16px;
  box-shadow:0 10px 30px -20px rgba(25,40,80,.4);
  overflow:hidden;
  max-height:calc(100vh - 150px);
  display:flex;flex-direction:column;
}
.editorScroll{overflow:auto;padding:6px 0 14px}

.group{border-bottom:1px solid #f0f3f9}
.group:last-child{border-bottom:0}
.groupHead{
  display:flex;align-items:center;gap:8px;width:100%;
  background:none;border:0;font:inherit;font-size:13px;font-weight:720;
  color:var(--ink);padding:13px 16px;cursor:pointer;text-align:left;
}
.groupHead:hover{background:#fafbfe}
.groupHead .caret{
  margin-left:auto;color:#aab2c2;font-size:11px;transition:transform .16s;
}
.group.collapsed .caret{transform:rotate(-90deg)}
.group.collapsed .groupBody{display:none}
.groupBody{padding:0 16px 10px}

.field{display:grid;grid-template-columns:1fr;gap:5px;padding:7px 0 9px;border-bottom:1px dashed #f0f3f9}
.field:last-child{border-bottom:0}
.field .flabel{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:640}
.field .flabel .key{
  font-family:ui-monospace,Consolas,monospace;font-size:10.5px;color:#9aa4b6;font-weight:500;
}
.field .fhint{font-size:11px;color:var(--muted);margin-top:-2px}
.field .frow{display:flex;align-items:center;gap:8px}
.field input[type=text],.field input[type=number],.field textarea,.field select{
  font:inherit;font-size:12.5px;color:var(--ink);background:#fbfcfe;
  border:1px solid var(--line);border-radius:9px;padding:7px 10px;width:100%;
  transition:border-color .14s,box-shadow .14s;
}
.field input[type=text]:focus,.field input[type=number]:focus,.field textarea:focus{
  outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(59,110,246,.14);background:#fff;
}
.field input[type=color]{
  width:36px;height:32px;padding:2px;border:1px solid var(--line);border-radius:8px;
  background:#fff;cursor:pointer;flex:none;
}
.field input[type=range]{flex:1;-webkit-appearance:none;appearance:none;height:4px;border-radius:99px;background:#dfe5ef}
.field input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:50%;background:var(--accent);cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.field .num{width:64px;flex:none;font-variant-numeric:tabular-nums;text-align:right;font-size:12px;color:var(--muted);font-weight:650}
.field .reset{
  margin-left:auto;border:0;background:none;cursor:pointer;color:#c2c9d6;font-size:13px;
  padding:2px 4px;border-radius:6px;line-height:1;
}
.field .reset:hover{color:var(--accent);background:#eef3fd}

.switch{position:relative;width:40px;height:23px;border-radius:99px;background:#d8dfea;border:0;cursor:pointer;transition:background .16s;flex:none;padding:0}
.switch::after{content:"";position:absolute;top:2.5px;left:2.5px;width:18px;height:18px;background:#fff;border-radius:50%;transition:transform .18s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch.on{background:var(--accent)}
.switch.on::after{transform:translateX(17px)}
.switchLabel{font-size:12px;color:var(--muted);font-weight:600}

.sizeTable{display:grid;gap:6px;width:100%}
.sizeRow{display:grid;grid-template-columns:52px 1fr 1fr;gap:8px;align-items:center;font-size:12px;color:var(--muted)}
.sizeRow .tag{font-weight:650;color:var(--ink);font-size:11.5px}

/* ---------- 右侧 ---------- */
.side{display:grid;gap:14px;min-width:0}
.panel{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 10px 30px -22px rgba(25,40,80,.4);overflow:hidden}
.panelHead{
  display:flex;align-items:center;gap:8px;padding:11px 15px;border-bottom:1px solid var(--line);
  font-size:12.5px;font-weight:700;color:var(--ink);
}
.panelHead .sub{margin-left:auto;font-size:11px;font-weight:600;color:var(--muted)}

.previewBox{position:relative;overflow:auto;background:#f4f6fb;height:560px}
.previewScale{position:relative;overflow:hidden;transform-origin:0 0}
#preview{width:760px;height:900px;border:0;transform-origin:0 0;background:#fff;display:block}
.previewEmpty{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:10px;color:var(--muted);font-size:13px;text-align:center;padding:24px;line-height:1.8;
}

.codeBody{
  max-height:340px;overflow:auto;background:#fbfcfe;font-family:ui-monospace,"Cascadia Code",Consolas,monospace;
  font-size:11.5px;line-height:1.65;padding:8px 0;
}
.ln{display:grid;grid-template-columns:46px 1fr;gap:0;padding:0 12px;transition:background .18s}
.ln .no{color:#b6becd;text-align:right;padding-right:12px;user-select:none;font-variant-numeric:tabular-nums}
.ln .tx{white-space:pre-wrap;word-break:break-all;color:#39445a}
.ln.hl{background:#eaf1ff}
.ln.hl .tx{color:#123a8f;font-weight:600}
.ln.hl .no{color:#7d9be0}

.note{font-size:11.5px;color:var(--muted);line-height:1.7;padding:9px 15px;border-top:1px solid #f0f3f9;background:#fbfcfe}
.note b{color:var(--ink)}

/* ---------- 源码弹窗 ---------- */
.mask{position:fixed;inset:0;background:rgba(18,24,40,.42);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:22px;z-index:60;opacity:0;pointer-events:none;transition:opacity .18s}
.mask.on{opacity:1;pointer-events:auto}
.modal{background:#fff;border-radius:16px;width:100%;max-width:1000px;max-height:86vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 30px 70px -24px rgba(12,20,40,.5)}
.modalHead{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.modalHead h2{margin:0;font-size:15px;font-weight:750}
.modalHead .sp{flex:1}
.modal textarea{
  flex:1;min-height:420px;border:0;outline:none;resize:none;padding:14px 16px;
  font-family:ui-monospace,Consolas,monospace;font-size:12px;line-height:1.6;color:#2b3450;background:#fbfcfe;
}
.modalFoot{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;align-items:center}
.modalFoot .grow{flex:1;font-size:11.5px;color:var(--muted)}

.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,12px);background:#1d2333;color:#fff;padding:10px 17px;border-radius:11px;font-size:13px;font-weight:600;box-shadow:0 14px 32px -12px rgba(10,16,30,.6);opacity:0;pointer-events:none;transition:all .2s;z-index:90;max-width:min(92vw,520px);text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>潮汐秘境定制器</h1>
      <p>不翻代码，直接改计算器的标题、尺寸、配色和动效 —— 改完导出即用</p>
    </div>
    <div class="actions">
      <button class="btn" id="btnOpen">打开计算器文件</button>
      <button class="btn" id="btnAdvanced">直接编辑源码</button>
      <button class="btn" id="btnApply" disabled>应用到本机</button>
      <button class="btn primary" id="btnExport" disabled>导出新 HTML</button>
    </div>
  </header>

  <div class="status">
    <span class="dot" id="dot"></span>
    <span id="statusText">尚未载入文件 —— 点右上角「打开计算器文件」，选择 <b>潮汐秘境计算器.html</b></span>
    <span class="grow"></span>
    <button class="btn mini" id="btnResetAll" disabled>全部恢复默认</button>
    <button class="btn mini" id="btnClearOverride" style="display:none">清除本机覆盖</button>
  </div>

  <div class="main">
    <section class="editor">
      <div class="editorScroll" id="editor"></div>
    </section>

    <aside class="side">
      <div class="panel">
        <div class="panelHead">实时预览<span class="sub" id="previewSub"></span></div>
        <div class="previewBox" id="previewBox">
          <div class="previewScale" id="previewScale"><iframe id="preview" title="预览"></iframe></div>
          <div class="previewEmpty" id="previewEmpty">
            载入计算器文件后，这里会显示真实界面的实时预览
          </div>
        </div>
      </div>

      <div class="panel">
        <div class="panelHead">配置源码<span class="sub" id="codeSub">改动会同步高亮到对应代码行</span></div>
        <div class="codeBody" id="codeBody"></div>
        <div class="note">
          <b>两种生效方式：</b>「应用到本机」只影响你自己浏览器里打开的计算器（立即见效，不改文件）；
          「导出新 HTML」生成一份新文件，适合上传到 GitHub Pages 给别人用。
        </div>
      </div>
    </aside>
  </div>
</div>

<div class="mask" id="advMask">
  <div class="modal">
    <div class="modalHead">
      <h2>直接编辑源码</h2>
      <span class="sp"></span>
      <button class="btn mini" id="advReload">还原</button>
      <button class="btn mini" data-close="advMask">关闭</button>
    </div>
    <textarea id="advText" spellcheck="false"></textarea>
    <div class="modalFoot">
      <span class="grow" id="advHint">改动会先合并回内存中的文件，再点「导出新 HTML」或「应用到本机」才会真正生效。</span>
      <button class="btn" id="advApply">合并到当前文件</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<input type="file" id="filePick" accept=".html,text/html" hidden>

<script>
(function () {
  'use strict';

  var LS_SRC = 'tidal.customizer.source.v1';
  var LS_NAME = 'tidal.customizer.name.v1';
  var LS_CFG = 'tidal.config.override.v1';

  var BLOCK_RE = /<!-- ==== CONFIG:BEGIN ==== -->[\s\S]*?<!-- ==== CONFIG:END ==== -->/;
  var MARK_BEGIN = '<!-- ==== CONFIG:BEGIN ==== -->';
  var MARK_END = '<!-- ==== CONFIG:END ==== -->';

  var state = {
    source: '',
    fileName: '潮汐秘境计算器.html',
    original: null,
    cfg: null,
    blockLines: [],
    blockStartLine: 1,
    dirty: false
  };

  function $(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function clone(o) {
    return JSON.parse(JSON.stringify(o));
  }

  var toastTimer = 0;
  function toast(msg) {
    var t = $('toast');
    t.textContent = msg;
    t.classList.add('on');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove('on'); }, 2400);
  }

  /* ----------------------------------------------------------- 配置块处理 */

  function extractConfig(src) {
    var m = src.match(BLOCK_RE);
    if (!m) return null;
    var block = m[0];
    var jm = block.match(/<script[^>]*type=["']application\/json["'][^>]*>([\s\S]*?)<\/script>/i);
    if (!jm) return null;
    var jsonText = jm[1];
    var cfg;
    try { cfg = JSON.parse(jsonText); } catch (e) { return null; }
    var idx = src.indexOf(block);
    var startLine = src.slice(0, idx).split('\n').length;
    return { block: block, cfg: cfg, startLine: startLine };
  }

  function buildBlock(cfg) {
    return MARK_BEGIN + '\n<script id="tidal-config" type="application/json">\n' +
      JSON.stringify(cfg, null, 2) + '\n<\/script>\n' + MARK_END;
  }

  /* ----------------------------------------------------------- 路径读写 */

  function getPath(obj, path) {
    var parts = path.split('.');
    var cur = obj;
    for (var i = 0; i < parts.length; i++) {
      if (cur == null) return undefined;
      cur = cur[parts[i]];
    }
    return cur;
  }
  function setPath(obj, path, val) {
    var parts = path.split('.');
    var cur = obj;
    for (var i = 0; i < parts.length - 1; i++) {
      if (cur[parts[i]] == null || typeof cur[parts[i]] !== 'object') cur[parts[i]] = {};
      cur = cur[parts[i]];
    }
    cur[parts[parts.length - 1]] = val;
  }

  /* --------------------------------------------------------------- 表单 */

  var SCHEMA = [
    {
      id: 'text', title: '标题与文案', open: true, fields: [
        { path: 'text.title', key: 'title', label: '主标题', type: 'text' },
        { path: 'text.subtitle', key: 'subtitle', label: '副标题', type: 'text' },
        { path: 'text.btnShot', key: 'btnShot', label: '按钮：截图识图', type: 'text' },
        { path: 'text.btnHelp', key: 'btnHelp', label: '按钮：帮助', type: 'text' },
        { path: 'text.btnSettings', key: 'btnSettings', label: '按钮：设置', type: 'text' },
        { path: 'text.paletteLabel', key: 'paletteLabel', label: '工具条前缀', type: 'text' },
        { path: 'text.statRemaining', key: 'statRemaining', label: '计数：剩余钻石', type: 'text' },
        { path: 'text.statFound', key: 'statFound', label: '计数：已找到', type: 'text' },
        { path: 'text.statPending', key: 'statPending', label: '计数：待定', type: 'text' },
        { path: 'text.recTitle', key: 'recTitle', label: '推荐区标题', type: 'text' },
        { path: 'text.recFmt', key: 'recFmt', label: '推荐文案', type: 'text', hint: '可用占位符 {row} 与 {col}' },
        { path: 'text.recProb', key: 'recProb', label: '推荐副文案', type: 'text', hint: '可用占位符 {p}' },
        { path: 'text.recDone', key: 'recDone', label: '完成时文案', type: 'text' },
        { path: 'text.btnUndo', key: 'btnUndo', label: '按钮：撤销', type: 'text' },
        { path: 'text.btnDeduce', key: 'btnDeduce', label: '按钮：自动推导', type: 'text' },
        { path: 'text.btnClear', key: 'btnClear', label: '按钮：清空棋盘', type: 'text' },
        { path: 'text.badgeExact', key: 'badgeExact', label: '徽标：精确', type: 'text' },
        { path: 'text.badgeApprox', key: 'badgeApprox', label: '徽标：近似', type: 'text' },
        { path: 'text.legendLow', key: 'legendLow', label: '图例：低概率', type: 'text' },
        { path: 'text.legendMid', key: 'legendMid', label: '图例：中概率', type: 'text' },
        { path: 'text.legendHigh', key: 'legendHigh', label: '图例：高概率', type: 'text' }
      ]
    },
    {
      id: 'board', title: '棋盘尺寸', open: true, fields: [
        { path: 'board.sizes', key: 'sizes', label: '三张地图的边长与钻石数', type: 'sizeTable', hint: '改动会同时影响顶部切换按钮' },
        { path: 'board.defaultSize', key: 'defaultSize', label: '默认地图边长', type: 'number', min: 4, max: 24, step: 1 },
        { path: 'board.cellSize', key: 'cellSize', label: '格子边长', type: 'range', min: 22, max: 60, step: 1, unit: 'px' },
        { path: 'board.gap', key: 'gap', label: '格子间距', type: 'range', min: 0, max: 12, step: 1, unit: 'px' },
        { path: 'board.radius', key: 'radius', label: '圆角', type: 'range', min: 0, max: 22, step: 1, unit: 'px' }
      ]
    },
    {
      id: 'prob', title: '概率与分级', open: true, fields: [
        { path: 'prob.lowMax', key: 'lowMax', label: '低概率上限', type: 'range', min: 5, max: 45, step: 1, unit: '%', hint: '低于此值用蓝色' },
        { path: 'prob.midMax', key: 'midMax', label: '中概率上限', type: 'range', min: 20, max: 90, step: 1, unit: '%', hint: '高于此值用红色' },
        { path: 'prob.useGlobal', key: 'useGlobal', label: '默认开启「全局钻石总数约束」', type: 'switch' },
        { path: 'prob.timeMs', key: 'timeMs', label: '求解时间上限', type: 'number', min: 50, max: 5000, step: 50, unit: 'ms', hint: '超过后切换到近似模式' }
      ]
    },
    {
      id: 'color', title: '配色', open: true, fields: [
        { path: 'color.bg', key: 'bg', label: '页面背景（上）', type: 'color' },
        { path: 'color.bg2', key: 'bg2', label: '页面背景（下）', type: 'color' },
        { path: 'color.panel', key: 'panel', label: '面板底色', type: 'color' },
        { path: 'color.ink', key: 'ink', label: '主文字', type: 'color' },
        { path: 'color.muted', key: 'muted', label: '次要文字', type: 'color' },
        { path: 'color.line', key: 'line', label: '分隔线', type: 'color' },
        { path: 'color.accent', key: 'accent', label: '主题色', type: 'color' },
        { path: 'color.accentInk', key: 'accentInk', label: '主题色上的文字', type: 'color' },
        { path: 'color.low', key: 'low', label: '低概率（蓝）', type: 'color' },
        { path: 'color.mid', key: 'mid', label: '中概率（棕）', type: 'color' },
        { path: 'color.high', key: 'high', label: '高概率（红）', type: 'color' },
        { path: 'color.diaBg', key: 'diaBg', label: '钻石格底色', type: 'color' },
        { path: 'color.diaLine', key: 'diaLine', label: '钻石格描边', type: 'color' },
        { path: 'color.safeBg', key: 'safeBg', label: '安全格底色', type: 'color' },
        { path: 'color.safeInk', key: 'safeInk', label: '安全格叉号', type: 'color' },
        { path: 'color.rec', key: 'rec', label: '推荐格高亮', type: 'color' }
      ]
    },
    {
      id: 'nums', title: '数字 1–8 的颜色', open: false, fields: [
        { path: 'color.num1', key: 'num1', label: '数字 1', type: 'color' },
        { path: 'color.num2', key: 'num2', label: '数字 2', type: 'color' },
        { path: 'color.num3', key: 'num3', label: '数字 3', type: 'color' },
        { path: 'color.num4', key: 'num4', label: '数字 4', type: 'color' },
        { path: 'color.num5', key: 'num5', label: '数字 5', type: 'color' },
        { path: 'color.num6', key: 'num6', label: '数字 6', type: 'color' },
        { path: 'color.num7', key: 'num7', label: '数字 7', type: 'color' },
        { path: 'color.num8', key: 'num8', label: '数字 8', type: 'color' }
      ]
    },
    {
      id: 'fx', title: '动效与细节', open: true, fields: [
        { path: 'fx.tint', key: 'tint', label: '概率底色浓度', type: 'range', min: 0, max: 0.2, step: 0.01, unit: '', pct: true },
        { path: 'fx.pulse', key: 'pulse', label: '推荐格呼吸动画', type: 'switch' },
        { path: 'fx.pulseMs', key: 'pulseMs', label: '呼吸周期', type: 'range', min: 600, max: 3000, step: 50, unit: 'ms' },
        { path: 'fx.showCoords', key: 'showCoords', label: '显示行列坐标', type: 'switch' }
      ]
    }
  ];

  /* ------------------------------------------------------------ 渲染表单 */

  function renderEditor() {
    var host = $('editor');
    host.innerHTML = '';
    if (!state.cfg) return;

    SCHEMA.forEach(function (group) {
      var g = document.createElement('div');
      g.className = 'group' + (group.open ? '' : ' collapsed');

      var head = document.createElement('button');
      head.type = 'button';
      head.className = 'groupHead';
      head.innerHTML = '<span>' + esc(group.title) + '</span><span class="caret">▾</span>';
      head.addEventListener('click', function () { g.classList.toggle('collapsed'); });

      var body = document.createElement('div');
      body.className = 'groupBody';

      group.fields.forEach(function (f) {
        body.appendChild(renderField(f));
      });

      g.appendChild(head);
      g.appendChild(body);
      host.appendChild(g);
    });
  }

  function renderField(f) {
    var d = document.createElement('div');
    d.className = 'field';

    var lab = document.createElement('div');
    lab.className = 'flabel';
    lab.innerHTML = '<span>' + esc(f.label) + '</span><span class="key">' + esc(f.path) + '</span>';

    var rst = document.createElement('button');
    rst.type = 'button';
    rst.className = 'reset';
    rst.textContent = '↺';
    rst.title = '恢复为文件中的原值';
    rst.addEventListener('click', function () {
      var orig = getPath(state.original, f.path);
      if (orig === undefined) return;
      setPath(state.cfg, f.path, clone(orig));
      refreshField(f);
      onChanged(f.key);
    });
    lab.appendChild(rst);

    d.appendChild(lab);
    if (f.hint) {
      var h = document.createElement('div');
      h.className = 'fhint';
      h.textContent = f.hint;
      d.appendChild(h);
    }

    d.appendChild(buildControl(f));
    d._field = f;
    return d;
  }

  function buildControl(f) {
    var val = getPath(state.cfg, f.path);
    var wrap = document.createElement('div');
    wrap.className = 'frow';

    if (f.type === 'text') {
      var inp = document.createElement('input');
      inp.type = 'text';
      inp.value = val == null ? '' : val;
      inp.addEventListener('input', function () {
        setPath(state.cfg, f.path, inp.value);
        onChanged(f.key, true);
      });
      inp.addEventListener('focus', function () { highlightKey(f.key); });
      wrap.appendChild(inp);
      wrap._sync = function () { inp.value = getPath(state.cfg, f.path) || ''; };

    } else if (f.type === 'number') {
      var n = document.createElement('input');
      n.type = 'number';
      if (f.min != null) n.min = f.min;
      if (f.max != null) n.max = f.max;
      if (f.step != null) n.step = f.step;
      n.value = val;
      n.addEventListener('input', function () {
        var v = parseFloat(n.value);
        if (isFinite(v)) { setPath(state.cfg, f.path, v); onChanged(f.key, true); }
      });
      n.addEventListener('focus', function () { highlightKey(f.key); });
      wrap.appendChild(n);
      if (f.unit) {
        var u = document.createElement('span');
        u.className = 'num';
        u.textContent = f.unit;
        wrap.appendChild(u);
      }
      wrap._sync = function () { n.value = getPath(state.cfg, f.path); };

    } else if (f.type === 'range') {
      var r = document.createElement('input');
      r.type = 'range';
      r.min = f.min; r.max = f.max; r.step = f.step;
      r.value = val;
      var out = document.createElement('span');
      out.className = 'num';
      var show = function () {
        var v = parseFloat(r.value);
        out.textContent = f.pct ? Math.round(v * 100) + '%' : (v + (f.unit || ''));
      };
      show();
      r.addEventListener('input', function () {
        setPath(state.cfg, f.path, parseFloat(r.value));
        show();
        onChanged(f.key, true);
      });
      r.addEventListener('focus', function () { highlightKey(f.key); });
      wrap.appendChild(r);
      wrap.appendChild(out);
      wrap._sync = function () { r.value = getPath(state.cfg, f.path); show(); };

    } else if (f.type === 'color') {
      var c = document.createElement('input');
      c.type = 'color';
      c.value = normalizeHex(val);
      var t = document.createElement('input');
      t.type = 'text';
      t.value = val;
      c.addEventListener('input', function () {
        setPath(state.cfg, f.path, c.value);
        t.value = c.value;
        onChanged(f.key, true);
      });
      t.addEventListener('input', function () {
        var v = t.value.trim();
        if (/^#[0-9a-fA-F]{6}$/.test(v)) {
          setPath(state.cfg, f.path, v);
          c.value = v;
          onChanged(f.key, true);
        }
      });
      c.addEventListener('focus', function () { highlightKey(f.key); });
      t.addEventListener('focus', function () { highlightKey(f.key); });
      wrap.appendChild(c);
      wrap.appendChild(t);
      wrap._sync = function () {
        var v = getPath(state.cfg, f.path);
        c.value = normalizeHex(v);
        t.value = v;
      };

    } else if (f.type === 'switch') {
      var s = document.createElement('button');
      s.type = 'button';
      s.className = 'switch' + (val ? ' on' : '');
      var sl = document.createElement('span');
      sl.className = 'switchLabel';
      sl.textContent = val ? '开' : '关';
      s.addEventListener('click', function () {
        var v = !s.classList.contains('on');
        s.classList.toggle('on', v);
        sl.textContent = v ? '开' : '关';
        setPath(state.cfg, f.path, v);
        onChanged(f.key, true);
      });
      wrap.appendChild(s);
      wrap.appendChild(sl);
      wrap._sync = function () {
        var v = !!getPath(state.cfg, f.path);
        s.classList.toggle('on', v);
        sl.textContent = v ? '开' : '关';
      };

    } else if (f.type === 'sizeTable') {
      var tbl = document.createElement('div');
      tbl.className = 'sizeTable';
      for (var i = 0; i < 3; i++) {
        tbl.appendChild(sizeRow(i));
      }
      wrap.style.display = 'block';
      wrap.appendChild(tbl);
      wrap._sync = function () {
        var rows = tbl.querySelectorAll('.sizeRow');
        var sizes = state.cfg.board.sizes || [];
        var dias = state.cfg.board.diamonds || [];
        for (var k = 0; k < rows.length; k++) {
          var ins = rows[k].querySelectorAll('input');
          if (ins[0]) ins[0].value = sizes[k] == null ? '' : sizes[k];
          if (ins[1]) ins[1].value = dias[k] == null ? '' : dias[k];
        }
      };
    }

    return wrap;
  }

  function sizeRow(i) {
    var row = document.createElement('div');
    row.className = 'sizeRow';
    row.innerHTML = '<span class="tag">地图 ' + (i + 1) + '</span>';

    var a = document.createElement('input');
    a.type = 'number'; a.min = 4; a.max = 24; a.step = 1;
    a.title = '边长';
    a.value = (state.cfg.board.sizes || [])[i];

    var b = document.createElement('input');
    b.type = 'number'; b.min = 1; b.max = 99; b.step = 1;
    b.title = '钻石数';
    b.value = (state.cfg.board.diamonds || [])[i];

    a.addEventListener('input', function () {
      var v = parseInt(a.value, 10);
      if (isFinite(v)) {
        if (!Array.isArray(state.cfg.board.sizes)) state.cfg.board.sizes = [];
        state.cfg.board.sizes[i] = v;
        onChanged('sizes', true);
      }
    });
    b.addEventListener('input', function () {
      var v = parseInt(b.value, 10);
      if (isFinite(v)) {
        if (!Array.isArray(state.cfg.board.diamonds)) state.cfg.board.diamonds = [];
        state.cfg.board.diamonds[i] = v;
        onChanged('diamonds', true);
      }
    });
    a.addEventListener('focus', function () { highlightKey('sizes'); });
    b.addEventListener('focus', function () { highlightKey('sizes'); });

    row.appendChild(a);
    row.appendChild(b);
    return row;
  }

  function normalizeHex(v) {
    if (typeof v === 'string' && /^#[0-9a-fA-F]{6}$/.test(v.trim())) return v.trim();
    if (typeof v === 'string' && /^#[0-9a-fA-F]{3}$/.test(v.trim())) {
      var s = v.trim().slice(1);
      return '#' + s[0] + s[0] + s[1] + s[1] + s[2] + s[2];
    }
    return '#000000';
  }

  /** 某个字段被重置后，把控件值同步回来 */
  function refreshField(f) {
    var wrap = null;
    var nodes = document.querySelectorAll('.field');
    for (var i = 0; i < nodes.length; i++) {
      if (nodes[i]._field && nodes[i]._field.path === f.path) {
        var c = nodes[i].querySelector('.frow');
        if (c && c._sync) wrap = c;
      }
    }
    if (wrap && wrap._sync) wrap._sync();
  }

  function syncAllControls() {
    var nodes = document.querySelectorAll('.field');
    for (var i = 0; i < nodes.length; i++) {
      var c = nodes[i].querySelector('.frow');
      if (c && c._sync) c._sync();
    }
  }

  /* --------------------------------------------------------- 变更与预览 */

  var pushTimer = 0;
  function onChanged(key, debounce) {
    state.dirty = true;
    markStatus();
    if (key) highlightKey(key);
    clearTimeout(pushTimer);
    if (debounce) {
      pushTimer = setTimeout(pushPreview, 90);
    } else {
      pushPreview();
    }
  }

  var previewReady = false;

  function pushPreview() {
    if (!previewReady || !state.cfg) return;
    var frame = $('preview');
    try {
      frame.contentWindow.postMessage({ __tidal: 'config', config: state.cfg }, '*');
    } catch (e) { /* 忽略 */ }
  }

  function buildPreview() {
    var iframe = $('preview');
    if (!state.source) return;
    $('previewEmpty').style.display = 'none';
    previewReady = false;
    var src = state.source.replace('<head>', '<head>\n<script>window.__TIDAL_NO_STORAGE__=true;<\/script>');
    if (src === state.source) {
      src = state.source.replace('</head>', '<script>window.__TIDAL_NO_STORAGE__=true;<\/script></head>');
    }
    iframe.srcdoc = src;

    var done = false;
    iframe.onload = function () {
      if (done) return;
      done = true;
      setTimeout(function () {
        previewReady = true;
        pushPreview();
        fitPreview();
      }, 90);
    };
  }

  function fitPreview() {
    var box = $('previewBox');
    var sc = $('previewScale');
    var frame = $('preview');
    if (!box || !sc || !frame) return;
    var baseW = 760, baseH = 900;
    var w = box.clientWidth || baseW;
    var s = Math.min(1, w / baseW);
    frame.style.transform = 'scale(' + s + ')';
    sc.style.width = Math.round(baseW * s) + 'px';
    sc.style.height = Math.round(baseH * s) + 'px';
    box.style.height = Math.min(Math.round(baseH * s), Math.round(window.innerHeight * 0.72)) + 'px';
  }

  /* ------------------------------------------------------------ 源码面板 */

  function renderCode() {
    var body = $('codeBody');
    body.innerHTML = '';
    if (!state.source) return;
    var ex = extractConfig(state.source);
    if (!ex) {
      body.innerHTML = '<div class="ln"><span class="no">!</span><span class="tx">未能解析配置块</span></div>';
      return;
    }
    var lines = ex.block.split('\n');
    state.blockLines = lines;
    state.blockStartLine = ex.startLine;

    var frag = document.createDocumentFragment();
    lines.forEach(function (line, i) {
      var row = document.createElement('div');
      row.className = 'ln';
      row.setAttribute('data-line', state.blockStartLine + i);
      var no = document.createElement('span');
      no.className = 'no';
      no.textContent = state.blockStartLine + i;
      var tx = document.createElement('span');
      tx.className = 'tx';
      tx.textContent = line;
      row.appendChild(no);
      row.appendChild(tx);
      frag.appendChild(row);
    });
    body.appendChild(frag);
    $('codeSub').textContent = '配置块 ' + state.blockStartLine + '–' + (state.blockStartLine + lines.length - 1) + ' 行';
  }

  function escapeRe(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

  function highlightKey(key) {
    if (!key || !state.blockLines.length) return;
    var body = $('codeBody');
    var re = new RegExp('"\\s*' + escapeRe(key) + '\\s*"\\s*:');
    var rows = body.querySelectorAll('.ln');
    for (var i = 0; i < rows.length; i++) rows[i].classList.remove('hl');
    for (i = 0; i < state.blockLines.length; i++) {
      if (re.test(state.blockLines[i])) {
        var target = rows[i];
        if (!target) break;
        target.classList.add('hl');
        var top = target.offsetTop - body.clientHeight / 2 + target.offsetHeight / 2;
        body.scrollTo({ top: Math.max(0, top), behavior: 'smooth' });
        break;
      }
    }
  }

  /* --------------------------------------------------------------- 状态 */

  function markStatus() {
    var loaded = !!state.source;
    $('btnExport').disabled = !loaded;
    $('btnApply').disabled = !loaded;
    $('btnResetAll').disabled = !loaded;
    $('btnAdvanced').disabled = !loaded;
    var dot = $('dot');
    var txt = $('statusText');
    if (!loaded) {
      dot.className = 'dot';
      txt.innerHTML = '尚未载入文件 —— 点右上角「打开计算器文件」，选择 <b>潮汐秘境计算器.html</b>';
      return;
    }
    dot.className = 'dot ' + (state.dirty ? 'warn' : 'ok');
    txt.innerHTML = '已载入 <b>' + esc(state.fileName) + '</b>' +
      (state.dirty ? ' · 有未导出的改动' : ' · 与文件一致') +
      ' · 配置块起始于第 ' + state.blockStartLine + ' 行';
    $('previewSub').textContent = state.dirty ? '未保存' : '';
  }

  /* --------------------------------------------------------------- 载入 */

  function loadSource(text, name) {
    var ex = extractConfig(text);
    if (!ex) {
      toast('这个文件里没有找到配置块，请确认选的是潮汐秘境计算器.html');
      return false;
    }
    state.source = text;
    state.fileName = name || state.fileName;
    state.cfg = ex.cfg;
    state.original = clone(ex.cfg);
    state.blockStartLine = ex.startLine;
    state.dirty = false;

    try {
      localStorage.setItem(LS_SRC, text);
      localStorage.setItem(LS_NAME, state.fileName);
    } catch (e) { /* 超配额就忽略 */ }

    $('previewEmpty').style.display = 'none';
    renderEditor();
    renderCode();
    buildPreview();
    markStatus();
    fitPreview();
    return true;
  }

  function loadFromCache() {
    var txt = null, nm = '';
    try {
      txt = localStorage.getItem(LS_SRC);
      nm = localStorage.getItem(LS_NAME) || '';
    } catch (e) { return false; }
    if (!txt || !extractConfig(txt)) return false;
    return loadSource(txt, nm || '潮汐秘境计算器.html');
  }

  /* --------------------------------------------------------------- 导出 */

  function exportHtml() {
    if (!state.source) return;
    var block = buildBlock(state.cfg);
    var out = state.source.replace(BLOCK_RE, function () { return block; });
    if (out === state.source && !state.dirty) {
      /* 没有变化也允许导出 */
    }
    var blob = new Blob([out], { type: 'text/html;charset=utf-8' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = state.fileName || '潮汐秘境计算器.html';
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1600);

    state.source = out;
    state.original = clone(state.cfg);
    state.dirty = false;
    try {
      localStorage.setItem(LS_SRC, out);
    } catch (e) { /* ignore */ }
    renderCode();
    markStatus();
    toast('已导出新的 HTML，替换原文件即可');
  }

  function applyLocal() {
    if (!state.cfg) return;
    try {
      localStorage.setItem(LS_CFG, JSON.stringify(state.cfg));
      $('btnClearOverride').style.display = '';
      toast('已写入本机，刷新计算器页面就能看到');
    } catch (e) {
      toast('写入失败：浏览器不允许本地存储');
    }
  }

  function resetAll() {
    if (!state.original) return;
    state.cfg = clone(state.original);
    syncAllControls();
    pushPreview();
    state.dirty = true;
    markStatus();
    toast('已全部恢复为文件中的原值');
  }

  /* --------------------------------------------------------------- 绑定 */

  function bind() {
    $('btnOpen').addEventListener('click', function () { $('filePick').click(); });
    $('filePick').addEventListener('change', function () {
      var f = $('filePick').files && $('filePick').files[0];
      if (!f) return;
      var fr = new FileReader();
      fr.onload = function () {
        loadSource(String(fr.result), f.name);
        toast('已载入，左侧随便改');
      };
      fr.readAsText(f);
    });

    $('btnExport').addEventListener('click', exportHtml);
    $('btnApply').addEventListener('click', applyLocal);
    $('btnResetAll').addEventListener('click', resetAll);

    $('btnClearOverride').addEventListener('click', function () {
      try {
        localStorage.removeItem(LS_CFG);
        toast('已清除本机外观覆盖');
        $('btnClearOverride').style.display = 'none';
      } catch (e) { /* ignore */ }
    });

    if (localStorage.getItem(LS_CFG)) $('btnClearOverride').style.display = '';

    $('btnAdvanced').addEventListener('click', function () {
      if (!state.source) return;
      $('advText').value = state.source;
      $('advMask').classList.add('on');
    });
    $('advReload').addEventListener('click', function () { $('advText').value = state.source; });
    $('advApply').addEventListener('click', function () {
      var txt = $('advText').value;
      var ex = extractConfig(txt);
      if (!ex) { toast('源码里找不到配置块，未合并'); return; }
      state.source = txt;
      state.cfg = ex.cfg;
      state.original = clone(ex.cfg);
      state.dirty = false;
      try { localStorage.setItem(LS_SRC, txt); } catch (e) {}
      renderEditor();
      renderCode();
      buildPreview();
      markStatus();
      $('advMask').classList.remove('on');
      toast('源码已合并');
    });

    document.querySelectorAll('[data-close]').forEach(function (b) {
      b.addEventListener('click', function () { $(b.getAttribute('data-close')).classList.remove('on'); });
    });
    $('advMask').addEventListener('mousedown', function (e) {
      if (e.target === $('advMask')) $('advMask').classList.remove('on');
    });

    window.addEventListener('resize', function () { fitPreview(); });

    /* 拖拽文件到页面即可载入 */
    document.addEventListener('dragover', function (e) { e.preventDefault(); });
    document.addEventListener('drop', function (e) {
      e.preventDefault();
      var f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
      if (!f) return;
      var fr = new FileReader();
      fr.onload = function () { loadSource(String(fr.result), f.name); };
      fr.readAsText(f);
    });

    window.addEventListener('message', function (e) {
      var d = e.data;
      if (d && d.__tidal === 'pong') { /* 可选握手，忽略 */ }
    });
  }

  /* --------------------------------------------------------------- 启动 */

  function init() {
    bind();
    markStatus();
    fitPreview();
    try {
      if (!loadFromCache()) {
        $('codeBody').innerHTML = '<div class="ln"><span class="no">—</span><span class="tx">载入文件后在这里显示配置源码</span></div>';
      }
    } catch (err) {
      var st = $('statusText');
      st.textContent = '载入缓存失败：' + (err && err.message ? err.message : err) + '，请手动打开文件';
      $('dot').className = 'dot warn';
    }
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();
</script>
</body>
</html>
